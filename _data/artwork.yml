# Artwork catalog for the Inks gallery (rendered by inks.html).
#
# To add a new piece, add another entry under `pieces`, in the order you
# want it to appear. No HTML changes needed.
#
# Fields:
#   id           unique slug, used for anchor links
#   title        display title
#   medium       materials/technique
#   year         year completed
#   price        number, in `currency` (no symbol/commas)
#   currency     ISO code, currently only "USD" is rendered with a $ sign
#   status       "available" | "sold" | "unavailable"
#   image        path to the image, URL-encoded if the filename has spaces
#   alt          descriptive alt text (never the filename)
#   stripe_link  Stripe Payment Link URL for this piece. Leave blank until
#                you've created the link in the Stripe Dashboard — the Buy
#                button only renders once this is filled in.
#
# NOTE: price is currently a flat $15 placeholder for every piece per
# florian's instruction — update per-piece once real pricing is set.

intro:
  image: "images/artwork/clear_dragon%20-%20compressed.png"
  alt: "Line-art ink drawing of a long, antlered dragon curled into a loose spiral"
  description: >
    The following selection of images consists of a series of drawings rendered with acrylic pigment.
    My inspiration for the work collected here is motivated by an appreciation for the mundane. In my
    many attempts to capture some tangible slice of the real world through abstract expression,
    sometimes everything goes just right from start to finish. I hope you enjoy viewing this small
    selection of examples of what can happen on the rare occasion that I manage to express my
    imagination fluently.

